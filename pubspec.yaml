name: telora
description: "A production-oriented worldwide voice/video calling and messaging application."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management & Reactive Architecture
  flutter_riverpod: ^2.5.1

  # Backend & Realtime
  supabase_flutter: ^2.5.5

  # WebRTC Engine
  flutter_webrtc: ^0.11.7

  # Push Notifications & Messaging
  firebase_core: ^3.1.0
  firebase_messaging: ^15.0.1
  flutter_local_notifications: ^17.1.2

  # Monetization (AdMob)
  google_mobile_ads: ^5.1.0

  # Hardware, Permissions & Network
  connectivity_plus: ^6.0.3
  permission_handler: ^11.3.1

  # Secure Storage & Cache
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3

  # UI Utilities & Networking
  cached_network_image: ^3.3.1
  image_picker: ^1.1.2
  intl: ^0.19.0
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
